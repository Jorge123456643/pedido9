<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>GALAXY • JADE</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    touch-action:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;

    display:flex;
    align-items:flex-end;
    justify-content:center;

    padding-bottom:7vh;

    opacity:0;
    animation:intro 3s ease forwards;
}

.title{
    text-align:center;
    color:white;

    font-family:
    system-ui,
    -apple-system,
    sans-serif;

    letter-spacing:7px;

    text-shadow:
    0 0 8px #fff,
    0 0 25px #ff3d69,
    0 0 60px #ff003c;
}

.title h1{
    font-size:clamp(22px,7vw,52px);
    font-weight:300;
}

.title p{
    margin-top:10px;
    font-size:10px;
    letter-spacing:5px;
    opacity:.55;
}

@keyframes intro{
    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>
</head>

<body>

<canvas id="space"></canvas>

<div id="ui">
    <div class="title">
        <h1>TE AMO JADE</h1>
        <p>INFINITE • BEAUTIFUL • ETERNAL</p>
    </div>
</div>

<script>

"use strict";

/* =========================================================
   GALAXY ENGINE
   Procedural cinematic particle system
========================================================= */

const canvas =
document.getElementById("space");

const ctx =
canvas.getContext("2d",{
    alpha:false,
    desynchronized:true
});


/* =========================================================
   DEVICE
========================================================= */

const mobile =
/Android|iPhone|iPad|iPod/i
.test(navigator.userAgent);

const quality =
mobile ? .72 : 1;

let W;
let H;
let DPR;

let CX;
let CY;


function resize(){

    DPR =
    Math.min(
        window.devicePixelRatio || 1,
        2
    );

    W =
    window.innerWidth;

    H =
    window.innerHeight;

    canvas.width =
    W * DPR;

    canvas.height =
    H * DPR;

    canvas.style.width =
    W+"px";

    canvas.style.height =
    H+"px";

    ctx.setTransform(
        DPR,0,0,DPR,0,0
    );

    CX=W/2;
    CY=H/2;
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =========================================================
   MATH
========================================================= */

const TAU =
Math.PI*2;

function rand(a,b){
    return Math.random()*(b-a)+a;
}

function clamp(v,a,b){
    return Math.max(a,
        Math.min(b,v));
}

function lerp(a,b,t){
    return a+(b-a)*t;
}


/* =========================================================
   GALAXY PARAMETERS
========================================================= */

const ARM_COUNT = 6;

const PARTICLE_COUNT =
Math.floor(
    (mobile ? 2400 : 5200)
    * quality
);

const STAR_COUNT =
Math.floor(
    (mobile ? 220 : 500)
    * quality
);

const DUST_COUNT =
Math.floor(
    (mobile ? 500 : 1100)
    * quality
);


/* =========================================================
   PARTICLES
========================================================= */

const particles=[];

for(
    let i=0;
    i<PARTICLE_COUNT;
    i++
){

    const r =
    Math.pow(
        Math.random(),
        1.65
    );

    const radius=r;

    const arm =
    Math.floor(
        Math.random()*ARM_COUNT
    );

    const baseAngle =
    arm*
    TAU/ARM_COUNT;

    const spiral =
    radius*5.4;

    const scatter =
    rand(-.32,.32)*
    (0.25+radius);

    particles.push({

        radius,

        angle:
        baseAngle+
        spiral+
        scatter,

        arm,

        size:
        rand(.25,1.45)*
        (1.3-radius*.55),

        speed:
        rand(.00018,.0007)*
        (1-radius*.6),

        brightness:
        rand(.25,1),

        depth:
        rand(.65,1.4),

        phase:
        rand(0,TAU),

        warm:
        Math.random()
    });
}


/* =========================================================
   STARS
========================================================= */

const stars=[];

for(
    let i=0;
    i<STAR_COUNT;
    i++
){

    stars.push({

        x:Math.random(),

        y:Math.random(),

        size:
        rand(.25,1.6),

        alpha:
        rand(.2,.95),

        phase:
        rand(0,TAU),

        speed:
        rand(.5,2.2)
    });
}


/* =========================================================
   COSMIC DUST
========================================================= */

const dust=[];

for(
    let i=0;
    i<DUST_COUNT;
    i++
){

    dust.push({

        angle:
        Math.random()*TAU,

        radius:
        Math.pow(
            Math.random(),
            .8
        ),

        size:
        rand(.3,2.4),

        alpha:
        rand(.03,.18),

        speed:
        rand(.00003,.00012)
    });
}


/* =========================================================
   COMETS
========================================================= */

const comets=[];

for(
    let i=0;
    i<7;
    i++
){

    comets.push({

        x:
        rand(-W,W),

        y:
        rand(-H,H),

        speed:
        rand(3,7),

        size:
        rand(1,2.5),

        life:
        rand(0,100),

        delay:
        rand(0,1000)
    });
}


/* =========================================================
   TOUCH PARALLAX
========================================================= */

let pointerX=0;
let pointerY=0;

let targetX=0;
let targetY=0;

let zoom=1;

window.addEventListener(
    "pointermove",
    e=>{

        targetX =
        (e.clientX-CX)/W;

        targetY =
        (e.clientY-CY)/H;
    }
);

window.addEventListener(
    "pointerdown",
    ()=>{

        zoom=1.08;
    }
);

window.addEventListener(
    "pointerup",
    ()=>{

        zoom=1;
    }
);


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground(){

    const bg =
    ctx.createRadialGradient(
        CX,
        CY,
        0,
        CX,
        CY,
        Math.max(W,H)*.85
    );

    bg.addColorStop(
        0,
        "#180710"
    );

    bg.addColorStop(
        .25,
        "#0b050d"
    );

    bg.addColorStop(
        .6,
        "#030208"
    );

    bg.addColorStop(
        1,
        "#000000"
    );

    ctx.fillStyle=bg;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}


/* =========================================================
   STARS
========================================================= */

function drawStars(time){

    for(
        const s of stars
    ){

        const twinkle =
        .55+
        Math.sin(
            time*.001*s.speed+
            s.phase
        )*.45;

        const x=s.x*W;
        const y=s.y*H;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            s.size,
            0,
            TAU
        );

        ctx.fillStyle=
        `rgba(
            255,
            225,
            235,
            ${s.alpha*twinkle}
        )`;

        ctx.fill();
    }
}


/* =========================================================
   NEBULA
========================================================= */

function drawNebula(time){

    ctx.save();

    ctx.translate(
        CX+targetX*35,
        CY+targetY*20
    );

    ctx.rotate(
        time*.000025
    );

    const radius=
    Math.min(W,H)*.72;

    for(
        let i=0;
        i<8;
        i++
    ){

        const r=
        radius*
        (.25+i*.09);

        const g=
        ctx.createRadialGradient(
            0,0,0,
            0,0,r
        );

        g.addColorStop(
            0,
            `rgba(
                255,
                ${40+i*8},
                ${80+i*5},
                .035
            )`
        );

        g.addColorStop(
            1,
            "rgba(0,0,0,0)"
        );

        ctx.fillStyle=g;

        ctx.beginPath();

        ctx.ellipse(
            0,
            0,
            r,
            r*.42,
            i*.35,
            0,
            TAU
        );

        ctx.fill();
    }

    ctx.restore();
}


/* =========================================================
   DUST
========================================================= */

function drawDust(time){

    ctx.save();

    ctx.translate(
        CX,
        CY
    );

    ctx.globalCompositeOperation=
    "lighter";

    for(
        const d of dust
    ){

        d.angle+=d.speed;

        const max=
        Math.min(W,H)*.7;

        const r=
        d.radius*max;

        const x=
        Math.cos(d.angle)*r;

        const y=
        Math.sin(d.angle)*r*.43;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            d.size,
            0,
            TAU
        );

        ctx.fillStyle=
        `rgba(
            255,
            75,
            100,
            ${d.alpha}
        )`;

        ctx.fill();
    }

    ctx.restore();

    ctx.globalCompositeOperation=
    "source-over";
}


/* =========================================================
   GALAXY PARTICLES
========================================================= */

function drawGalaxy(time){

    ctx.save();

    ctx.translate(
        CX+
        targetX*45,

        CY+
        targetY*25
    );

    ctx.scale(
        zoom,
        zoom
    );

    ctx.globalCompositeOperation=
    "lighter";


    const galaxyScale=
    Math.min(W,H)*.62;


    for(
        const p of particles
    ){

        p.angle+=p.speed;


        const r=
        p.radius*
        galaxyScale;


        const x=
        Math.cos(
            p.angle
        )*r;


        const y=
        Math.sin(
            p.angle
        )*r*.47;


        const depth=
        1+
        Math.sin(
            p.angle+p.phase
        )*.08;


        const px=
        x*depth;

        const py=
        y*depth;


        const distance=
        p.radius;


        const glow=
        Math.max(
            .08,
            1-distance
        );


        let red=255;
        let green;
        let blue;


        if(
            p.warm>.72
        ){

            green=
            95+
            glow*70;

            blue=
            65+
            glow*45;

        }else{

            green=
            30+
            glow*75;

            blue=
            95+
            glow*65;
        }


        const alpha=
        p.brightness*
        (.35+glow*.65);


        ctx.beginPath();

        ctx.arc(
            px,
            py,
            p.size*
            (1+glow),
            0,
            TAU
        );

        ctx.fillStyle=
        `rgba(
            ${red},
            ${green},
            ${blue},
            ${alpha}
        )`;

        ctx.fill();
    }

    ctx.restore();

    ctx.globalCompositeOperation=
    "source-over";
}


/* =========================================================
   CORE BLOOM
========================================================= */

function drawCore(time){

    const pulse=
    1+
    Math.sin(time*.002)*.08;


    const radius=
    Math.min(W,H)*
    .18*
    pulse;


    ctx.globalCompositeOperation=
    "lighter";


    /* SUPER BLOOM */

    const bloom=
    ctx.createRadialGradient(
        CX,
        CY,
        0,
        CX,
        CY,
        radius*3.8
    );

    bloom.addColorStop(
        0,
        "rgba(255,255,225,.95)"
    );

    bloom.addColorStop(
        .04,
        "rgba(255,205,120,.9)"
    );

    bloom.addColorStop(
        .12,
        "rgba(255,80,60,.55)"
    );

    bloom.addColorStop(
        .3,
        "rgba(255,20,90,.18)"
    );

    bloom.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle=bloom;

    ctx.beginPath();

    ctx.arc(
        CX,
        CY,
        radius*3.8,
        0,
        TAU
    );

    ctx.fill();


    /* CORE */

    const core=
    ctx.createRadialGradient(
        CX,
        CY,
        0,
        CX,
        CY,
        radius
    );

    core.addColorStop(
        0,
        "#ffffff"
    );

    core.addColorStop(
        .08,
        "#fff2c0"
    );

    core.addColorStop(
        .25,
        "#ff9c55"
    );

    core.addColorStop(
        .55,
        "#ff3d4f"
    );

    core.addColorStop(
        1,
        "rgba(150,0,60,0)"
    );

    ctx.fillStyle=core;

    ctx.beginPath();

    ctx.arc(
        CX,
        CY,
        radius,
        0,
        TAU
    );

    ctx.fill();


    /* HORIZONTAL ENERGY */

    const beam=
    ctx.createLinearGradient(
        CX-radius*3,
        CY,
        CX+radius*3,
        CY
    );

    beam.addColorStop(
        0,
        "rgba(255,0,80,0)"
    );

    beam.addColorStop(
        .5,
        "rgba(255,120,90,.5)"
    );

    beam.addColorStop(
        1,
        "rgba(255,0,80,0)"
    );

    ctx.fillStyle=beam;

    ctx.fillRect(
        CX-radius*3,
        CY-1,
        radius*6,
        2
    );


    ctx.globalCompositeOperation=
    "source-over";
}


/* =========================================================
   COMETS
========================================================= */

function drawComets(){

    ctx.globalCompositeOperation=
    "lighter";

    for(
        const c of comets
    ){

        c.x+=c.speed;

        c.y+=c.speed*.35;

        if(
            c.x>
            W+200 ||
            c.y>
            H+200
        ){

            c.x=
            -random(100,500);

            c.y=
            random(0,H);
        }


        const gradient=
        ctx.createLinearGradient(
            c.x,
            c.y,
            c.x-80,
            c.y-30
        );

        gradient.addColorStop(
            0,
            "rgba(255,220,220,.9)"
        );

        gradient.addColorStop(
            1,
            "rgba(255,0,80,0)"
        );


        ctx.strokeStyle=
        gradient;

        ctx.lineWidth=
        c.size;


        ctx.beginPath();

        ctx.moveTo(
            c.x,
            c.y
        );

        ctx.lineTo(
            c.x-80,
            c.y-30
        );

        ctx.stroke();
    }

    ctx.globalCompositeOperation=
    "source-over";
}


/* =========================================================
   VIGNETTE
========================================================= */

function vignette(){

    const g=
    ctx.createRadialGradient(
        CX,
        CY,
        Math.min(W,H)*.25,
        CX,
        CY,
        Math.max(W,H)*.8
    );

    g.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );

    g.addColorStop(
        1,
        "rgba(0,0,0,.72)"
    );

    ctx.fillStyle=g;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );
}


/* =========================================================
   MAIN LOOP
========================================================= */

let previous=0;

function render(time){

    const delta=
    Math.min(
        time-previous,
        40
    );

    previous=time;


    /* smooth parallax */

    targetX=
    lerp(
        targetX,
        targetX,
        .01
    );


    drawBackground();

    drawStars(time);

    drawNebula(time);

    drawDust(time);

    drawGalaxy(time);

    drawComets();

    drawCore(time);

    vignette();


    requestAnimationFrame(
        render
    );
}

requestAnimationFrame(
    render
);


/* =========================================================
   DOUBLE TAP = IMPULSO
========================================================= */

let lastTap=0;

canvas.addEventListener(
    "pointerdown",
    e=>{

        const now=
        performance.now();

        if(
            now-lastTap<350
        ){

            for(
                const p of particles
            ){

                p.angle+=
                rand(-.25,.25);

                p.speed*=1.8;
            }
        }

        lastTap=now;
    }
);

</script>

</body>
</html>
